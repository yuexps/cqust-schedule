name: 手动发布 Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '发布版本号 (如 3.0.0，留空则自动从 build.gradle.kts 提取)'
        required: false
        default: ''
        type: string
      release_title:
        description: 'Release 标题 (如 重科课表 3.0.0，留空则默认为版本号)'
        required: false
        default: ''
        type: string
      release_notes:
        description: '更新说明 (Markdown 格式，留空则自动提取近期提交记录)'
        required: false
        default: ''
        type: string
      is_prerelease:
        description: '是否标记为预发布 (Pre-release)'
        required: false
        default: false
        type: boolean

jobs:
  build-and-release:
    name: 编译打包并发布 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定版本号与发布信息
        id: prepare_meta
        run: |
          INPUT_VERSION="${{ github.event.inputs.version_name }}"
          if [ -z "$INPUT_VERSION" ]; then
            EXTRACTED_VERSION=$(grep 'versionName = ' androidApp/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            VERSION="$EXTRACTED_VERSION"
          else
            VERSION="$INPUT_VERSION"
          fi

          CLEAN_VERSION=$(echo "$VERSION" | sed 's/^[vV]//')
          TAG_NAME="v${CLEAN_VERSION}"

          INPUT_TITLE="${{ github.event.inputs.release_title }}"
          if [ -z "$INPUT_TITLE" ]; then
            TITLE="重科课表 ${TAG_NAME}"
          else
            TITLE="$INPUT_TITLE"
          fi

          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_title=$TITLE" >> $GITHUB_OUTPUT
          echo "准备发布版本: $TAG_NAME, 标题: $TITLE"

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x ./gradlew

      - name: 准备正式签名密钥 (如有配置 Secret)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "检测到云端密钥 Secret，配置签名环境变量..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > androidApp/release.jks
            echo "RELEASE_STORE_FILE=${{ github.workspace }}/androidApp/release.jks" >> $GITHUB_ENV
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "未检测到云端密钥 Secret，使用默认签名打包..."
          fi

      - name: 编译 Release APK
        run: |
          ./gradlew :androidApp:assembleRelease --stacktrace

      - name: 收集并规范化 APK 命名
        id: collect_apks
        run: |
          mkdir -p release_apks
          VERSION="${{ steps.prepare_meta.outputs.version }}"

          find androidApp/build/outputs/apk/release/ -name "*.apk" | while read -r apk_path; do
            file_name=$(basename "$apk_path")
            if [[ "$file_name" == *"arm64-v8a"* ]]; then
              new_name="cqust-schedule-v${VERSION}-arm64-v8a.apk"
            elif [[ "$file_name" == *"armeabi-v7a"* ]]; then
              new_name="cqust-schedule-v${VERSION}-armeabi-v7a.apk"
            elif [[ "$file_name" == *"x86_64"* ]]; then
              new_name="cqust-schedule-v${VERSION}-x86_64.apk"
            elif [[ "$file_name" == *"universal"* ]]; then
              new_name="cqust-schedule-v${VERSION}-universal.apk"
            else
              new_name="cqust-schedule-v${VERSION}-${file_name}"
            fi
            cp "$apk_path" "release_apks/$new_name"
            echo "产物就绪: $new_name"
          done

      - name: 生成发布日志
        id: generate_notes
        run: |
          INPUT_NOTES="${{ github.event.inputs.release_notes }}"
          if [ -n "$INPUT_NOTES" ]; then
            echo "$INPUT_NOTES" > release_notes.md
          else
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "### 更新记录 (${PREV_TAG} ... HEAD)" > release_notes.md
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" >> release_notes.md
            else
              echo "### 更新记录" > release_notes.md
              git log -n 10 --pretty=format:"- %s (%h)" >> release_notes.md
            fi
          fi

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.prepare_meta.outputs.tag_name }}
          name: ${{ steps.prepare_meta.outputs.release_title }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease == 'true' }}
          files: release_apks/*.apk